name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ==========================================
  # 1. RUN TESTS
  # ==========================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run pytest
        run: |
          python -m pytest -v


  # ==========================================
  # 2. BUILD DOCKER IMAGE
  # ==========================================
  docker:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ai-assisted-devops-platform:${{ github.sha }} \
            .

      - name: Save Docker image
        run: |
          docker save \
            ai-assisted-devops-platform:${{ github.sha }} \
            -o image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar


  # ==========================================
  # 3. TRIVY SECURITY SCAN
  # ==========================================
  security:
    name: Trivy Security Scan
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ./docker-artifact

      - name: Load Docker image
        run: |
          docker load -i ./docker-artifact/image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-assisted-devops-platform:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH


  # ==========================================
  # 4. PUSH IMAGE TO GHCR
  # ==========================================
  push:
    name: Push Image to GHCR
    needs: security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ./docker-artifact

      - name: Load Docker image
        run: |
          docker load -i ./docker-artifact/image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag \
            ai-assisted-devops-platform:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/ai-assisted-devops-platform:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/ai-assisted-devops-platform:${{ github.sha }}